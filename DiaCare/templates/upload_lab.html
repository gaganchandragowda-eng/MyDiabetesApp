<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload Lab Report - DiaCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">
  <div class="container" style="max-width:700px;">
    <h2 class="mb-4">Upload Lab Report</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">

      <!-- REPORT TYPE -->
      <div class="mb-3">
        <label class="form-label fw-bold">Report Type</label>
        <select class="form-control" name="report_type" required>
          <option value="">Select Report Type</option>

          <!-- Diabetes-specific reports -->
          <option>HbA1c</option>
          <option>Fasting Glucose</option>
          <option>Postprandial Glucose (PPBS)</option>
          <option>Random Blood Sugar (RBS)</option>

          <!-- Blood panel -->
          <option>CBC</option>
          <option>Lipid Profile</option>

          <!-- Organ function -->
          <option>Kidney Function Test (KFT)</option>
          <option>Liver Function Test (LFT)</option>
          <option>Thyroid Profile (T3/T4/TSH)</option>

          <!-- Urine -->
          <option>Urine Microalbumin</option>

          <!-- Imaging -->
          <option>ECG</option>
          <option>Ultrasound</option>
        </select>
      </div>

      <!-- FILE INPUT -->
      <div class="mb-3">
        <label class="form-label fw-bold">Upload File</label>
        <!-- MUST match Flask route → request.files.get('report_file') -->
        <input type="file" class="form-control" name="report_file" required>
        <div class="form-text">Allowed: pdf, png, jpg, jpeg, txt, csv</div>
      </div>

      <!-- NOTES -->
      <div class="mb-3">
        <label class="form-label fw-bold">Notes (optional)</label>
        <textarea class="form-control" name="notes" rows="3"></textarea>
      </div>

      <!-- BUTTONS -->
      <button type="submit" class="btn btn-primary">Upload</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-link">Back to Dashboard</a>

    </form>
  </div>
</body>
</html>
